# tmux settings
## change prefix keybinding to c-a
unbind-key c-b
set -g prefix c-a
bind-key c-a send-prefix

## General improvements
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"  # True color support
set -g history-limit 50000  # Increase scrollback
set -s escape-time 10  # Faster command sequences
set -g base-index 1  # Start windows at 1
setw -g pane-base-index 1  # Start panes at 1
set -g renumber-windows on  # Renumber windows when one is closed

## move tmux status bar to top
set-option -g status-position bottom

# enable mouse on
set-option -g mouse on

# keybindings
# change mode-keys to vim keybindings
setw -g mode-keys vi

# Better copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# vim-like pane splitting (keep current path)
bind-key v split-window -h -c "#{pane_current_path}"  # split pane vertically (right)
bind-key s split-window -v -c "#{pane_current_path}"  # split pane horizontally (below)

# vim-like pane navigation
bind-key h select-pane -L  # move to the left pane
bind-key j select-pane -D  # move to the pane below
bind-key k select-pane -U  # move to the pane above
bind-key l select-pane -R  # move to the right pane

# vim-like resizing (with repeat)
bind-key -r H resize-pane -L 5  # resize pane left
bind-key -r J resize-pane -D 5  # resize pane down
bind-key -r K resize-pane -U 5  # resize pane up
bind-key -r L resize-pane -R 5  # resize pane right

# Window navigation
bind-key -n M-H previous-window
bind-key -n M-L next-window

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

# Quick pane zoom
bind-key z resize-pane -Z

# Synchronize panes toggle
bind-key y setw synchronize-panes \; display "Synchronize panes: #{?pane_synchronized,ON,OFF}"

# Claude Code integration
bind-key C new-window -n "claude" "claude"  # Create new window with Claude Code
bind-key c-c split-window -h -c "#{pane_current_path}" "claude"  # Split horizontally with Claude Code
bind-key c-v split-window -v -c "#{pane_current_path}" "claude"  # Split vertically with Claude Code

# Custom session for neovim + claude workflow
bind-key N new-session -d -s "nvim-claude" \; \
    send-keys "nvim" Enter \; \
    split-window -h -c "#{pane_current_path}" \; \
    send-keys "claude" Enter \; \
    select-pane -L

# Session management shortcuts
bind-key S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind-key K confirm kill-session

# Popup for quick commands/scratch terminal
bind-key Space popup -d '#{pane_current_path}' -xC -yC -w80% -h80%

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux theme
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha

# Catppuccin customizations
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Yank to system clipboard
set -g @yank_selection_mouse 'clipboard'

# Focus events for vim integration
set -g focus-events on

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
